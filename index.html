<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
html{-webkit-text-size-adjust:100%;}
body{
  min-height:100vh;
  background: linear-gradient(180deg,#7fc0ff 0%,#ffc8e4 55%,#ffb4d8 100%);
  background-attachment: fixed;
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding:34px 16px 44px;
  color:#333;
  position:relative;
  overflow-x:hidden;
}
/* 装饰光斑层 */
.deco{position:fixed;border-radius:50%;filter:blur(40px);opacity:.5;z-index:0;pointer-events:none;}
.deco.d1{width:220px;height:220px;background:#8fd0ff;top:-60px;left:-70px;}
.deco.d2{width:260px;height:260px;background:#ffb7dd;top:38%;right:-90px;}
.deco.d3{width:200px;height:200px;background:#ffe0a8;bottom:-70px;left:10%;}
.content{position:relative;z-index:1;max-width:560px;margin:0 auto;}

.header{
  text-align:center;
  margin-bottom:34px;
}
.avatar-wrap{
  width:118px;
  height:118px;
  margin:0 auto 14px;
  border-radius:50%;
  padding:4px;
  background:linear-gradient(135deg,rgba(255,255,255,.85),rgba(255,255,255,.35));
  box-shadow:0 8px 26px rgba(120,80,160,.22);
}
.avatar{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  display:block;
}
h1{
  font-size:34px;
  color:#fff;
  text-shadow:0 2px 8px rgba(80,60,140,.28);
  margin-bottom:6px;
  letter-spacing:2px;
}
.desc{
  color:#fff;
  font-size:16px;
  opacity:.94;
  text-shadow:0 1px 4px rgba(80,60,140,.18);
}
.stats{
  margin-top:12px;
  display:inline-flex;
  gap:10px;
  align-items:center;
  background:rgba(255,255,255,.22);
  border:1px solid rgba(255,255,255,.4);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border-radius:999px;
  padding:6px 14px;
  font-size:12px;
  color:#fff;
  opacity:.92;
}

details{
  background:rgba(255,255,255,.32);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border-radius:22px;
  margin-bottom:16px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.45);
  box-shadow:0 6px 20px rgba(120,80,160,.12);
}
summary{
  padding:18px 22px;
  font-size:21px;
  font-weight:600;
  color:#fff;
  cursor:pointer;
  list-style:none;
  display:flex;
  justify-content:space-between;
  align-items:center;
  user-select:none;
  text-shadow:0 1px 4px rgba(80,60,140,.2);
}
summary::-webkit-details-marker{display:none;}
summary .badge{
  font-size:12px;
  font-weight:500;
  background:rgba(255,255,255,.35);
  border-radius:999px;
  padding:3px 10px;
  text-shadow:none;
}
summary::after{
  content:"⌃";
  font-size:24px;
  font-weight:400;
  transition:transform .25s ease;
}
details[open] summary::after{transform:rotate(180deg);}
.item-wrap{
  padding:0 14px 16px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.site-card{
  background:rgba(255,255,255,.52);
  border-radius:18px;
  padding:13px 15px;
  display:flex;
  align-items:center;
  gap:12px;
  border:1px solid rgba(255,255,255,.6);
  transition:transform .15s ease, background .15s ease;
}
.site-card:active{transform:scale(.98);}
.icon{
  font-size:26px;
  width:38px;
  text-align:center;
  flex-shrink:0;
}
.site-info{
  flex:1;
  min-width:0;
}
.site-card a{text-decoration:none;display:block;}
.site-name{
  font-size:17px;
  font-weight:600;
  color:#222;
  display:block;
  margin-bottom:3px;
  line-height:1.3;
}
.site-link{
  font-size:11px;
  color:#7a6a8c;
  word-break:break-all;
  line-height:1.4;
  display:block;
}

@media (prefers-reduced-motion: reduce){
  summary::after{transition:none;}
  .site-card:active{transform:none;}
}
</style>

function renderList(data, containerId){
  var html = "";
  for(var i=0;i<data.length;i++){
    var item = data[i];
    html += '<div class="site-card">'
          +   '<span class="icon">'+item[0]+'</span>'
          +   '<div class="site-info">'
          +     '<a href="'+item[2]+'" target="_blank" rel="noopener">'
          +       '<span class="site-name">'+item[1]+'</span>'
          +       '<span class="site-link">'+item[2]+'</span>'
          +     '</a>'
          +   '</div>'
          + '</div>';
  }
  document.getElementById(containerId).innerHTML = html;
}
